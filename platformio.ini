[platformio]
core_dir        = .platformio
description     = Firmware for ESP82xx/ESP32/ESP32-S2/ESP32-S3/ESP32-C3 for easy IoT deployment of sensors.
boards_dir      = boards
lib_dir         = lib
build_cache_dir = .cache
extra_configs   =
  platformio_core_defs.ini
  platformio_esp82xx_base.ini
  platformio_esp82xx_envs.ini
  platformio_esp32_envs.ini
  platformio_esp32_solo1.ini
  platformio_esp32s2_envs.ini
  platformio_esp32s3_envs.ini
  platformio_special_envs.ini
  platformio_esp32c2_envs.ini
  platformio_esp32c3_envs.ini
  platformio_esp32c5_envs.ini
  platformio_esp32c6_envs.ini
  platformio_esp32c61_envs.ini
  platformio_esp32p4_envs.ini
  platformio_esp32p4r3_envs.ini


;default_envs = normal_ESP32_4M
default_envs = custom_all_ui_sht2x_ESP32_4M316k
;default_envs = max_ESP32c5_8M1M

;default_envs = normal_ESP32c6_4M316k_LittleFS_CDC
; default_envs = custom_ESP8266_4M1M

;default_envs = normal_ESP8266_4M1M
;default_envs = test_beta_ESP8266_4M1M
; ..etc
;build_cache_dir = $PROJECT_DIR\.buildcache


; add these:
; -Werror -Wall -Wextra -pedantic -Wcast-align -Wcast-qual -Wctor-dtor-privacy -Wdisabled-optimization -Wformat=2 -Winit-self -Wlogical-op
;                    -Wmissing-include-dirs -Wnoexcept -Wold-style-cast -Woverloaded-virtual -Wredundant-decls -Wshadow -Wsign-promo -Wstrict-null-sentinel
;                    -Wstrict-overflow=5 -Wundef -Wno-unused -Wno-variadic-macros -Wno-parentheses -fdiagnostics-show-option
; thanks @chouffe103
[compiler_warnings]
build_flags = -Wall -Wno-parentheses -fdiagnostics-show-option


[minimal_size]
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -s


[espota]
upload_protocol = espota
; each flag in a new line
; Do not use port 8266 for OTA, since that's used for ESPeasy p2p
upload_flags_esp8266 =
  --port=18266
upload_flags_esp32 =
  --port=3232
build_flags = -DFEATURE_ARDUINO_OTA=1
upload_port = 192.168.1.152


[debug_flags]
;build_flags               = -Wstack-usage=300
build_flags               =

[mqtt_flags]
build_flags               = -DMQTT_MAX_PACKET_SIZE=1024

; Shared flags for the "all UI + SHT2x" custom builds.
; Every web UI page is enabled and the CSS/JS/favicon blobs are compiled into the
; firmware instead of being fetched from the CDN, so the GUI works on an isolated
; network with an empty filesystem.
[all_ui_sht2x]
build_flags               = -DUSES_P122
                            -DWEBSERVER_CSS
                            -DEMBED_ESPEASY_DEFAULT_MIN_CSS
                            -DWEBSERVER_INCLUDE_JS
                            -DWEBSERVER_FAVICON
                            -DWEBSERVER_ROOT
                            -DWEBSERVER_ADVANCED
                            -DWEBSERVER_CONFIG
                            -DWEBSERVER_CONTROL
                            -DWEBSERVER_CONTROLLERS
                            -DWEBSERVER_CUSTOM
                            -DWEBSERVER_DEVICES
                            -DWEBSERVER_DOWNLOAD
                            -DWEBSERVER_FACTORY_RESET
                            -DWEBSERVER_FILELIST
                            -DWEBSERVER_HARDWARE
                            -DWEBSERVER_I2C_SCANNER
                            -DWEBSERVER_INTERFACES
                            -DWEBSERVER_JSON
                            -DWEBSERVER_LOG
                            -DWEBSERVER_METRICS
                            -DWEBSERVER_NETWORK
                            -DWEBSERVER_PINSTATES
                            -DWEBSERVER_RULES
                            -DWEBSERVER_SETUP
                            -DWEBSERVER_SYSINFO
                            -DWEBSERVER_SYSVARS
                            -DWEBSERVER_TIMINGSTATS
                            -DWEBSERVER_TOOLS
                            -DWEBSERVER_UPLOAD
                            -DWEBSERVER_WIFI_SCANNER
                            -DWEBSERVER_CSVVAL

; Every web UI page, with the CSS/JS/favicon blobs compiled into the firmware instead of
; being fetched from the CDN, so the GUI works on an isolated network with an empty
; filesystem. Shared by the "all UI" custom builds.
[all_ui_pages]
build_flags               = -DWEBSERVER_CSS
                            -DEMBED_ESPEASY_DEFAULT_MIN_CSS
                            -DWEBSERVER_INCLUDE_JS
                            -DWEBSERVER_FAVICON
                            -DWEBSERVER_ROOT
                            -DWEBSERVER_ADVANCED
                            -DWEBSERVER_CONFIG
                            -DWEBSERVER_CONTROL
                            -DWEBSERVER_CONTROLLERS
                            -DWEBSERVER_CUSTOM
                            -DWEBSERVER_DEVICES
                            -DWEBSERVER_DOWNLOAD
                            -DWEBSERVER_FACTORY_RESET
                            -DWEBSERVER_FILELIST
                            -DWEBSERVER_HARDWARE
                            -DWEBSERVER_I2C_SCANNER
                            -DWEBSERVER_INTERFACES
                            -DWEBSERVER_JSON
                            -DWEBSERVER_LOG
                            -DWEBSERVER_METRICS
                            -DWEBSERVER_NETWORK
                            -DWEBSERVER_PINSTATES
                            -DWEBSERVER_RULES
                            -DWEBSERVER_SETUP
                            -DWEBSERVER_SYSINFO
                            -DWEBSERVER_SYSVARS
                            -DWEBSERVER_TIMINGSTATS
                            -DWEBSERVER_TOOLS
                            -DWEBSERVER_UPLOAD
                            -DWEBSERVER_WIFI_SCANNER
                            -DWEBSERVER_CSVVAL

; Plugin/controller set for the "energy + climate" node:
;   P001  Switch input (PIR / movement sensor)
;   P068  SHT3x temperature + humidity
;   P122  SHT2x temperature + humidity
;   P153  SHT4x temperature + humidity
;   P182  ISKRA MT681 / eHZ 681 smart meter over SML
;   C005  Home Assistant / openHAB MQTT
; FEATURE_I2CMULTIPLEXER enables the runtime TCA9546a/PCA9546 selection on the
; Hardware page; PLUGIN_BUILD_CUSTOM suppresses the default NORMAL plugin set so
; only the plugins listed here are compiled in.
[energy_climate_set]
build_flags               = -DPLUGIN_BUILD_CUSTOM
                            -DUSES_P001
                            -DUSES_P068
                            -DUSES_P122
                            -DUSES_P153
                            -DUSES_P182
                            -DUSES_C005
                            -DFEATURE_I2CMULTIPLEXER=1

[extra_scripts_default]
extra_scripts             = pre:tools/pio/install-requirements.py
                            pre:tools/pio/set-ci-defines.py
                            pre:tools/pio/generate-compiletime-defines.py

[extra_scripts_esp8266]
extra_scripts             = pre:tools/pio/concat_cpp_files.py
                            ${extra_scripts_default.extra_scripts}
                            post:tools/pio/gzip-firmware.py
                            post:tools/pio/copy_files.py


[common]
lib_archive               = no
lib_ldf_mode              = chain
lib_compat_mode           = strict
shared_libdeps_dir        = lib
framework                 = arduino
upload_speed              = 115200
monitor_speed             = 115200
monitor_dtr               = 0
monitor_rts               = 0
;targets                   = size, checkprogsize
targets                   =
;src_filter                = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<*/Commands_tmp/> -<*/ControllerQueue_tmp/> -<*/DataStructs_tmp/> -<*/DataTypes_tmp/>  -<*/ESPEasyCore_tmp/>  -<*/Globals_tmp/> -<*/Helpers_tmp/> -<*/PluginStructs_tmp/>  -<*/WebServer_tmp/>

; Backwards compatibility: https://github.com/platformio/platformio-core/issues/4270
;build_src_filter  = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<*/Commands/> -<*/ControllerQueue/> -<*/DataStructs/> -<*/DataTypes/> -<*/Globals/> -<*/Helpers/> -<*/PluginStructs/>  -<*/WebServer/>


[env]
extends                   = common

